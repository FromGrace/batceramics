# BAT Ceramics – Pages CMS
# Schritt 3: Produktpflege für Handy/Desktop vorbereiten
# Die Website-Darstellung wird erst in späteren Schritten angepasst.

media:
  # Produktbilder aus Pages CMS bleiben im bereits verwendeten Ordner media/.
  - name: product_images
    label: Produktbilder
    input: media
    output: /media
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe

  # Feste Bilder der Website (Hero etc.) bleiben getrennt.
  - name: site_images
    label: Website-Bilder
    input: assets/images
    output: /assets/images
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe

  # Feste Website-Videos wie das Hero-Video.
  - name: site_videos
    label: Website-Videos
    input: assets/videos
    output: /assets/videos
    categories: [video]
    extensions: [mp4, mov, webm]
    rename: safe

  # Logos bleiben in ihrem eigenen Ordner.
  - name: logos
    label: Logos
    input: assets/logos
    output: /assets/logos
    categories: [image]
    extensions: [png, jpg, jpeg, webp, svg]
    rename: false

content:
  - name: products
    label: Produkte
    type: file
    path: content/products.json
    format: json
    operations:
      delete: false
    fields:
      # content/products.json bleibt ein Objekt mit dem Schlüssel "products".
      # Das entspricht der bestehenden Website-Logik data.products.
      - name: products
        label: Produkte
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · {workNumber}"
        fields:
          # Technische ID: stabil und unabhängig von Name/Werkstücknummer.
          # Für die normale Pflege nicht sichtbar und nicht editierbar.
          - name: id
            type: uuid
            hidden: true
            options:
              editable: false
              generate: false

          - name: workNumber
            label: Werkstücknummer
            type: string
            description: "Frei eintragen, z. B. 6 / 2026, 06-2026 oder Eisregen 4 / 2026."
            options:
              maxlength: 80

          - name: name
            label: Produktname
            type: string
            required: true
            options:
              maxlength: 120

          - name: status
            label: Status
            type: select
            required: true
            options:
              values:
                - name: Verfügbar
                  label: Verfügbar
                - name: Reserviert
                  label: Reserviert
                - name: In neuem Zuhause
                  label: In neuem Zuhause
                - name: Verkauft
                  label: "Verkauft – Altbestand (in Schritt 4 umstellen)"
              placeholder: Status auswählen

          - name: featured
            label: Ausgewähltes Stück
            type: boolean
            default: false
            description: "Aktivieren, wenn das Stück zusätzlich im Bereich „Ausgewählte Stücke“ erscheinen soll. Beliebig viele Stücke sind möglich."

          - name: image
            label: Hauptbild
            type: image
            options:
              media: product_images
              extensions: [jpg, jpeg, png, webp]
              rename: safe

          - name: gallery
            label: Weitere Bilder
            type: image
            description: "Optional: bis zu 5 zusätzliche Produktbilder."
            options:
              media: product_images
              multiple:
                max: 5
              unique: true
              extensions: [jpg, jpeg, png, webp]
              rename: safe

          - name: category
            label: Produktart
            type: select
            required: true
            options:
              values:
                - name: Tasse
                  label: Tasse
                - name: Teller
                  label: Teller
                - name: Schüssel
                  label: Schüssel
                - name: Kanne
                  label: Kanne
                - name: Vase
                  label: Vase
                - name: Sonstiges
                  label: Sonstiges
              placeholder: Produktart auswählen

          - name: collection
            label: Kollektion
            type: string
            description: "Optional, z. B. Eisregen. Gleiche Schreibweise bei zusammengehörigen Stücken verwenden."
            options:
              maxlength: 120

          - name: price
            label: Preis in €
            type: number
            options:
              min: 0

          - name: shippingNote
            label: Versandhinweis
            type: string
            description: "Optional, z. B. „zzgl. Versandkosten“."
            options:
              maxlength: 160

          - name: description
            label: Beschreibung / Geschichte
            type: text
            description: "Beschreibung des Stücks und seiner Entstehung."

          - name: videos
            label: Entstehungsvideos
            type: object
            description: "Optional. YouTube wird auf der Website erst nach aktivem Klick geladen."
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Videotitel
                type: string
                options:
                  maxlength: 120
              - name: youtube
                label: YouTube-Link
                type: string
                description: "Den normalen Link zum YouTube-Video einfügen."

          - name: etsyUrl
            label: Etsy-Link
            type: string
            description: "Optional. Hier einfach den direkten Link zum konkreten Etsy-Produkt einfügen. Wenn das Feld leer bleibt, wird später stattdessen „Anfragen“ angeboten."

settings:
  # Beim Speichern werden vorhandene, noch nicht migrierte Schlüssel nicht absichtlich entfernt.
  content:
    merge: true
  commit:
    identity: app
    templates:
      update: "BAT Ceramics: Inhalte über Pages CMS aktualisiert"
