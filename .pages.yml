# BAT Ceramics – Pages CMS
# Produktpflege für Handy und Desktop
# Zentrale Produktdaten: content/products.json
#
# Kollektionen werden separat unter "Kollektionen" gepflegt.
# Beim Produkt wird anschließend eine bestehende Kollektion ausgewählt.
# In products.json wird weiterhin nur der Kollektionname als Text gespeichert.

media:
  # Produktbilder aus Pages CMS
  - name: product_images
    label: Produktbilder
    input: media
    output: /media
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe

  # Feste Bilder der Website, z. B. Hero-Bilder
  - name: site_images
    label: Website-Bilder
    input: assets/images
    output: /assets/images
    categories: [image]
    extensions: [jpg, jpeg, png, webp]
    rename: safe

  # Feste Website-Videos, z. B. Hero-Video
  - name: site_videos
    label: Website-Videos
    input: assets/videos
    output: /assets/videos
    categories: [video]
    extensions: [mp4, mov, webm]
    rename: safe

  # Logos
  - name: logos
    label: Logos
    input: assets/logos
    output: /assets/logos
    categories: [image]
    extensions: [png, jpg, jpeg, webp, svg]
    rename: false

content:
  # Zentrale Liste der Kollektionen.
  # Eine Kollektion wird hier einmal angelegt und kann danach
  # bei beliebig vielen Produkten ausgewählt werden.
  - name: collections
    label: Kollektionen
    type: collection
    path: content/collections
    format: yaml

    filename:
      template: "{name}.yml"
      field: false

    view:
      primary: name
      fields: [name]
      sort: [name]
      search: [name]
      default:
        sort: name
        order: asc

    fields:
      - name: name
        label: Name der Kollektion
        type: string
        required: true
        description: "Eine Kollektion nur einmal anlegen, z. B. Meeresrauschen. Danach kann sie bei Produkten ausgewählt werden."
        options:
          maxlength: 120

  - name: products
    label: Produkte
    type: file
    path: content/products.json
    format: json

    operations:
      delete: false

    fields:
      # Die JSON-Datei bleibt:
      # {
      #   "products": [...]
      # }
      - name: products
        label: Produkte
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name} · {workNumber}"

        fields:
          # Interne technische ID.
          # Wird automatisch erzeugt und soll nicht manuell verändert werden.
          - name: id
            type: uuid
            hidden: true
            options:
              editable: false
              generate: false

          # Frei wählbare Werkstücknummer, z. B. 6 / 2026.
          - name: workNumber
            label: Werkstücknummer
            type: string
            description: "Frei eintragen, z. B. 6 / 2026, 06-2026 oder Eisregen 4 / 2026."
            options:
              maxlength: 80

          - name: name
            label: Produktname
            type: string
            required: true
            options:
              maxlength: 120

          - name: status
            label: Status
            type: select
            required: true
            default: Verfügbar
            options:
              values:
                - name: Verfügbar
                  label: Verfügbar
                - name: Reserviert
                  label: Reserviert
                - name: In neuem Zuhause
                  label: In neuem Zuhause
                - name: Verkauft
                  label: "Verkauft – Altbestand (später auf „In neuem Zuhause“ umstellen)"
              placeholder: Status auswählen

          # Beliebig viele Produkte können hervorgehoben werden.
          - name: featured
            label: Ausgewähltes Stück
            type: boolean
            default: false
            description: "Aktivieren, wenn das Stück zusätzlich im Bereich „Ausgewählte Stücke“ erscheinen soll."

          - name: image
            label: Hauptbild
            type: image
            options:
              media: product_images
              extensions: [jpg, jpeg, png, webp]
              rename: safe

          - name: gallery
            label: Weitere Bilder
            type: image
            description: "Optional: bis zu 5 zusätzliche Produktbilder."
            options:
              media: product_images
              multiple:
                max: 5
              unique: true
              extensions: [jpg, jpeg, png, webp]
              rename: safe

          - name: category
            label: Produktart
            type: select
            required: true
            options:
              values:
                - name: Tasse
                  label: Tasse
                - name: Teller
                  label: Teller
                - name: Schüssel
                  label: Schüssel
                - name: Kanne
                  label: Kanne
                - name: Vase
                  label: Vase
                - name: Sonstiges
                  label: Sonstiges
              placeholder: Produktart auswählen

          # Bestehende Kollektionen werden als Vorschläge angeboten.
          # Gespeichert wird weiterhin nur der Name, z. B. "Meeresrauschen".
          - name: collection
            label: Kollektion
            type: reference
            description: "Optional. Neue Kollektionen zuerst einmal unter „Kollektionen“ anlegen und hier anschließend auswählen."
            options:
              collection: collections
              search: "fields.name"
              value: "{fields.name}"
              label: "{fields.name}"

          - name: price
            label: Preis in €
            type: number
            options:
              min: 0

          - name: shipping
            label: Versand
            type: select
            default: included
            description: "Standard ist „Versand inklusive“. Nur ändern, wenn für dieses Stück etwas anderes gilt."
            options:
              values:
                - name: included
                  label: Versand inklusive
                - name: plus_shipping
                  label: zzgl. Versandkosten
                - name: etsy
                  label: Versandkosten siehe Etsy
                - name: pickup_only
                  label: Nur Abholung
                - name: arrangement
                  label: Versand nach Absprache
              placeholder: Versand auswählen

          - name: pickupPossible
            label: Abholung zusätzlich möglich
            type: boolean
            default: false
            description: "Aktivieren, wenn das Stück zusätzlich zum gewählten Versand auch abgeholt werden kann."

          - name: shippingNote
            label: Zusätzlicher Versandhinweis
            type: string
            description: "Optional, z. B. „Versand innerhalb Deutschlands 6,90 €“."
            options:
              maxlength: 160

          - name: description
            label: Beschreibung / Geschichte
            type: text
            description: "Beschreibung des Stücks und seiner Entstehung."

          - name: videos
            label: Entstehungsvideos
            type: object
            description: "Optional. YouTube wird auf der Website erst nach aktivem Klick geladen."
            list:
              collapsible:
                collapsed: true
                summary: "{title}"

            fields:
              - name: title
                label: Videotitel
                type: string
                options:
                  maxlength: 120

              - name: youtube
                label: YouTube-Link
                type: string
                description: "Den normalen Link zum YouTube-Video einfügen."

          - name: etsyUrl
            label: Etsy-Link
            type: string
            description: "Optional. Direkten Link zum konkreten Etsy-Produkt einfügen. Bleibt das Feld leer, wird auf der Website stattdessen „Anfragen“ angeboten."

settings:
  # Vorhandene, noch nicht im Schema enthaltene Schlüssel bleiben beim Speichern erhalten.
  content:
    merge: true

  commit:
    identity: app
    templates:
      update: "BAT Ceramics: Inhalte über Pages CMS aktualisiert"
