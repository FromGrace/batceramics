<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seite nicht gefunden – Bat Ceramics</title>
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#F4F0E8">
  <link rel="icon" type="image/png" href="assets/logos/logo.png">
  <link rel="apple-touch-icon" href="assets/logos/logo.png">
  <style>
    :root{
      --chalk:#F4F0E8;
      --clay:#B47755;
      --charcoal:#292722;
      --gray:#6F685E;
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      min-height:100vh;
      display:grid;
      place-items:center;
      padding:24px;
      background:var(--chalk);
      color:var(--charcoal);
      font-family:"Aptos","Segoe UI",Arial,Helvetica,sans-serif;
      text-align:center;
    }
    main{max-width:680px}
    img{width:92px;height:92px;object-fit:contain;margin-bottom:24px}
    .kicker{
      margin:0 0 10px;
      color:var(--clay);
      font-size:.78rem;
      font-weight:700;
      letter-spacing:.15em;
      text-transform:uppercase;
    }
    h1{
      margin:0 0 18px;
      font-family:Georgia,"Times New Roman",serif;
      font-size:clamp(2.6rem,9vw,5rem);
      line-height:1;
      font-weight:600;
    }
    p{margin:0 auto 28px;max-width:540px;color:var(--gray);line-height:1.7}
    a{
      display:inline-block;
      padding:12px 20px;
      border-radius:999px;
      background:var(--charcoal);
      color:var(--chalk);
      text-decoration:none;
      font-weight:700;
    }
  </style>
</head>
<body>
  <main>
    <img src="assets/logos/logo.png" alt="Bat Ceramics Logo">
    <p class="kicker">404 · Seite nicht gefunden</p>
    <h1>Hier ist gerade kein Stück.</h1>
    <p>Die aufgerufene Seite existiert nicht oder wurde verschoben. Zurück auf der Startseite findest du die aktuellen Keramik-Unikate und ihre Geschichten.</p>
    <a href="/">Zurück zu Bat Ceramics</a>
  </main>
</body>
</html>
